name: Link Health

on:
  repository_dispatch:
  schedule:
    - cron: "00 10 * * 1"
  workflow_dispatch:
    inputs:
      create_issue:
        description: "Create or update the link report issue (scheduled runs always report)."
        required: true
        default: true
        type: boolean

# Serialize report lookup/update so overlapping runs cannot create duplicates.
concurrency:
  group: link-health-report
  cancel-in-progress: false

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Broken Links? 🤔
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config ./.lychee.toml --no-progress .
          lycheeVersion: v0.24.2
          failIfEmpty: false
          debug: false
          fail: false
          format: json
          output: report-broken-links.json

      # Build only after checking: generated HTML must not change Lychee's inputs.
      - name: Read locked toolchain
        id: toolchain
        if: ${{ !cancelled() && steps.lychee.outputs.exit_code != '' }}
        run: |
          set -e
          ruby_version=$(awk '/^RUBY VERSION$/ { getline; sub(/^ +ruby /, ""); sub(/p[0-9]+$/, ""); print }' Gemfile.lock)
          bundler_version=$(awk '/^BUNDLED WITH$/ { getline; gsub(/ /, ""); print }' Gemfile.lock)
          : "${ruby_version:?Gemfile.lock must pin Ruby}"
          : "${bundler_version:?Gemfile.lock must pin Bundler}"
          echo "ruby=$ruby_version" >> "$GITHUB_OUTPUT"
          echo "bundler=$bundler_version" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        if: ${{ !cancelled() && steps.lychee.outputs.exit_code != '' }}
        with:
          ruby-version: ${{ steps.toolchain.outputs.ruby }}
          bundler: ${{ steps.toolchain.outputs.bundler }}
          bundler-cache: true
      - name: Locate links in published pages
        if: ${{ !cancelled() && steps.lychee.outputs.exit_code != '' }}
        run: python3 bin/link-report-sources.py report-broken-links.json "$RUNNER_TEMP/link-report-sources.json"
        env:
          BUNDLE_FROZEN: 'true'
          PAGES_REPO_NWO: ${{ github.repository }}

      - name: Summarize and upsert link report
        if: ${{ !cancelled() && steps.lychee.outputs.exit_code != '' }}
        uses: actions/github-script@v8
        env:
          CREATE_ISSUE: ${{ github.event_name != 'workflow_dispatch' || inputs.create_issue == true }}
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const report = JSON.parse(fs.readFileSync('report-broken-links.json', 'utf8'));
            // A rendering failure must not prevent the original summary/issue update.
            const indexPath = path.join(process.env.RUNNER_TEMP, 'link-report-sources.json');
            const sources = fs.existsSync(indexPath) ? JSON.parse(fs.readFileSync(indexPath, 'utf8')) : {};
            const sourceLinks = link => {
              const page = sources[path.resolve(link.source)];
              if (page) {
                const locations = page.links[link.url] ?? [page.url];
                return locations.map((url, i) => `[published post${locations.length > 1 ? ` ${i + 1}` : ''}](<${url}>)`).join(', ');
              }
              const source = path.relative(process.cwd(), path.resolve(link.source)).split(path.sep).map(encodeURIComponent).join('/');
              const line = link.span?.line ? `#L${link.span.line}` : '';
              return `[repository source](<${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${context.sha}/${source}${line}>)`;
            };
            const broken = [];
            const blocked = [];
            const verified = [];
            // Manually verified in #58; accept only 403 at these exact destinations.
            const verified403 = new Set(['https://wordpress.com/', 'https://www.npmjs.com/']);
            for (const [source, links] of Object.entries(report.error_map ?? {})) {
              for (const link of links) {
                const code = link.status.code;
                if (code === 403 && verified403.has(link.url)) {
                  verified.push({ source, ...link });
                  continue;
                }
                // These exact profile/status pairs are known crawler blocks, not proof of a dead link.
                const crawlerBlocked = code === 429 ||
                  (code === 406 && link.url === 'https://www.last.fm/user/augusto_hp') ||
                  (code === 999 && link.url === 'https://www.linkedin.com/in/augustohp');
                (crawlerBlocked ? blocked : broken).push({ source, ...link });
              }
            }
            for (const [source, links] of Object.entries(report.timeout_map ?? {})) {
              for (const link of links) broken.push({ source, ...link });
            }
            const section = (title, links) => `## ${title} (${links.length})\n\n` +
              (links.length ? links.map(link =>
                `- ${link.url} — ${link.status.text} (source: ${sourceLinks(link)})`
              ).join('\n') : 'None.') + '\n\n';
            const body = '<!-- link-health-report -->\n# Link health report\n\n' +
              'Published-post links point to the nearest preceding heading in rendered HTML (or the page when no heading exists). Repeated URLs list every matching section; these are section anchors, not exact-occurrence anchors. Sources without a published page link to the repository.\n\n' +
              section('Broken or unverified links', broken) +
              section('Crawler blocking / rate limiting', blocked) +
              section('Manually verified links / known 403 blocking', verified) +
              'The exact WordPress.com and npm homepage URLs were manually verified in #58. Their 403 responses do not fail the check or create a report issue; other failures still require review.\n\n' +
              'Blocked links still need manual verification; they are not counted as healthy.\n\n' +
              `[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;
            fs.writeFileSync('report-broken-links.md', body);
            await core.summary.addRaw(body).write();

            // Keep infrastructure/configuration failures red even if no links were reported.
            if (broken.length || !['0', '2'].includes(process.env.LYCHEE_EXIT_CODE) ||
                (process.env.LYCHEE_EXIT_CODE !== '0' && !(blocked.length + verified.length))) {
              core.setFailed('Broken/unverified links or link-checker failure; see the job summary.');
            }
            if (blocked.length) core.warning('Crawler-blocked links require manual verification.');
            if (process.env.CREATE_ISSUE !== 'true' || !(broken.length + blocked.length)) return;

            const title = '🤖 Broken Links Report';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            // Reuse the oldest legacy report; leave duplicate cleanup to the maintainer.
            const existing = issues.filter(issue => !issue.pull_request && issue.title === title)
              .sort((a, b) => a.number - b.number)[0];
            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['Bug'] });
            }
